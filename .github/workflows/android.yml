name: Installable Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android 17 tools
        run: scripts/setup-android.sh emulator
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.APK_SIGNING_KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/gridlauncher.jks"
          chmod 600 "$RUNNER_TEMP/gridlauncher.jks"
      - name: Test, lint and build signed APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/gridlauncher.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: gridlauncher
          SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
          ./gradlew assembleRelease --stacktrace
      - name: Build pull request with development key
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
          ./gradlew assembleRelease --stacktrace
      - name: Verify APK signatures and record checksum
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GridLauncher-Android17.apk
          (cd dist && sha256sum GridLauncher-Android17.apk > SHA256SUMS)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 17 install and UI tests
        run: scripts/emulator-test.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GridLauncher-Android17-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
      - name: Upload test and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            build/device-evidence/
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/gridlauncher.jks"
      - name: Publish tested APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/android-17-live-tiles'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android17-${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --title "GridLauncher 2.1 · Android 17 · build ${{ github.run_number }}" --notes "Square glass tiles, Android app shortcuts, dedicated layout editing, pinned positions, rich notifications, People tiles and separate layouts. Built, signature-verified, installed and UI-tested on Android 17 by GitHub Actions. See README for setup and supported features."
